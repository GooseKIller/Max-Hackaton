# Everything the solution needs locally, with one command:
#     docker compose up --build
services:
  bot:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      CATALOG_PATH: data/kazan_events.json
      DB_PATH: /srv/state/app.db
    volumes:
      - bot-state:/srv/state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  bot-state:
